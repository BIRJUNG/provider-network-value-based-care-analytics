[project]
name = "provider-network-value-based-care-analytics"
version = "0.1.0"
description = "Provider network performance and value-based care analytics platform with provider benchmarking, ACO performance, quality, market, and contracting dashboards."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "plotly>=5.20",
  "jinja2>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

